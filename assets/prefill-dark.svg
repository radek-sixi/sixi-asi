<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 382" width="860" height="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Reading a document for the first time: prefill speed">
